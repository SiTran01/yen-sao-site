<!-- Main Header -->

        <div class="container mx-auto px-6 flex justify-between items-center">
            <!-- Logo -->
            <a href="#" class="flex items-center gap-4 group">
                <img src="./assets/images/avt-svg.svg" alt="Yến Sào Tám Thủy Logo" class="w-20 h-20 object-contain group-hover:scale-105 transition-transform drop-shadow-md">
                <div class="flex flex-col text-left">
                    <span class="font-serif font-black text-xl text-[#4A2C2A] tracking-[0.15em] leading-tight group-hover:text-[#8B6508] transition-colors">YẾN SÀO</span>
                    <span class="font-serif font-black text-xl text-[#4A2C2A] tracking-[0.15em] leading-tight group-hover:text-[#8B6508] transition-colors">TÁM THỦY</span>

            <!-- Desktop Nav -->
            <nav
                class="hidden rounded-full border border-gray-400/30 bg-[#F4EDE5]/60 backdrop-blur-md px-12 py-3 md:flex items-center gap-10 shadow-sm">

            <!-- Actions -->
            <div class="flex items-center gap-4">
                <button onclick="document.getElementById('order').scrollIntoView({behavior:'smooth'})"
                    class="hidden md:flex items-center gap-2 border border-[#C5A059]/50 bg-[#4A1515] text-[#E8D1A7] px-8 py-2.5 rounded-[30px] font-bold text-xs hover:bg-[#C5A059] hover:text-white transition-all uppercase tracking-widest shadow-xl">
                    <span>ĐẶT HÀNG</span>

                <button class="md:hidden text-gray-800"
                    onclick="document.getElementById('mobile-menu').classList.remove('translate-x-full')">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
