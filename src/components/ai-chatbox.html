<!-- ═══════════════════════════════════════════
     AI CHATBOT WIDGET — Trợ Lý Tám Thủy
     ═══════════════════════════════════════════ -->

<!-- Floating trigger button -->
<button id="ai-chat-trigger" class="ai-chat-trigger" aria-label="Chat với Trợ Lý AI Tám Thủy">
    <span class="ai-trigger-icon-open">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73A2 2 0 0 1 10 4a2 2 0 0 1 2-2z"/>
            <circle cx="9" cy="14" r="1" fill="currentColor" stroke="none"/>
            <circle cx="15" cy="14" r="1" fill="currentColor" stroke="none"/>
        </svg>
    </span>
    <span class="ai-trigger-icon-close">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
    </span>
    <span class="ai-trigger-pulse"></span>
    <span class="ai-trigger-tooltip">Hỏi Trợ Lý AI</span>
</button>

<!-- Chat panel -->
<div id="ai-chat-panel" class="ai-chat-panel" role="dialog" aria-label="Trợ Lý AI Tám Thủy" aria-hidden="true">

    <!-- Header -->
    <div class="ai-chat-header">
        <div class="ai-chat-header-avatar">
            <img src="./assets/images/avt-svg.svg" alt="Thủy AI" class="ai-avatar-img">
            <span class="ai-online-dot"></span>
        </div>
        <div class="ai-chat-header-info">
            <p class="ai-chat-header-name">Trợ Lý Tám Thủy</p>
            <p class="ai-chat-header-status" id="ai-status-text">Đang hoạt động</p>
        </div>
        <div class="ai-chat-header-actions">
            <button class="ai-header-btn" id="ai-clear-btn" title="Xóa cuộc trò chuyện">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/>
                </svg>
            </button>
            <button class="ai-header-btn" id="ai-close-btn" title="Đóng">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                    <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Messages area -->
    <div class="ai-chat-messages" id="ai-chat-messages"></div>

    <!-- Quick replies -->
    <div class="ai-quick-replies" id="ai-quick-replies">
        <button class="ai-quick-btn" data-msg="Yến thô giá bao nhiêu?">💰 Hỏi giá yến thô</button>
        <button class="ai-quick-btn" data-msg="Yến sào có tác dụng gì?">✨ Lợi ích sức khỏe</button>
        <button class="ai-quick-btn" data-msg="Cách đặt hàng như thế nào?">📦 Cách đặt hàng</button>
        <button class="ai-quick-btn" data-msg="Có những loại yến nào?">🍃 Xem sản phẩm</button>
    </div>

    <!-- Input area -->
    <div class="ai-chat-input-area">
        <div class="ai-chat-input-wrapper">
            <textarea
                id="ai-chat-input"
                class="ai-chat-input"
                placeholder="Nhập câu hỏi về yến sào..."
                rows="1"
                maxlength="500"
            ></textarea>
            <button id="ai-send-btn" class="ai-send-btn" aria-label="Gửi">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
            </button>
        </div>
        <p class="ai-chat-disclaimer">AI có thể mắc lỗi · Liên hệ hotline để xác nhận</p>
    </div>
</div>
